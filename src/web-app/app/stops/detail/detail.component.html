<div *ngIf="stop">
  <header class="header">
    <a routerLink="/stops/search">
      <!-- Generator: Adobe Illustrator 22.1.0, SVG Export Plug-In  -->
      <svg version="1.1"
      	 xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:a="http://ns.adobe.com/AdobeSVGViewerExtensions/3.0/"
      	 x="0px" y="0px" width="14.3px" height="24px" viewBox="0 0 14.3 24" style="enable-background:new 0 0 14.3 24;"
      	 xml:space="preserve">
      <defs>
      </defs>
      <g>
      	<path d="M13.9,0.5C13.6,0.2,13.2,0,12.8,0c-0.4,0-0.7,0.1-1,0.4L0.5,10.9C0.2,11.2,0,11.6,0,12c0,0.4,0.2,0.8,0.5,1.1l11.3,10.5
      		c0.6,0.6,1.5,0.5,2.1-0.1c0.6-0.6,0.5-1.5-0.1-2.1L3.6,12l10.2-9.5C14.4,2,14.4,1.1,13.9,0.5z"/>
      </g>
      </svg>
      back
    </a>
    <div class="header-title">
      <h2>{{stop.alpha_nl}}</h2>
      <h3>id:{{stop.id}}</h3>
    </div>
    <input type='file' accept="image/*" (change)="readURL($event);" />
  </header>
  <div class="carousel">
    <carousel *ngIf="enabledCaroussel" [sources]="imageSources" [config]="config"></carousel>
  </div>
  <section>
    <header>
      <h4>Lines serving this stop</h4>
    </header>
    <article class="stop-line" *ngFor="let line of stop.transport">
      <div class="flex">
        <p class="line-type" [ngStyle]="{'color':line.textColor}">{{line.type}}</p>
        <p class="line-number" [ngStyle]="{'color':line.textColor, 'background-color':line.backColor}">{{line.number}}</p>
      </div>
      <div>
        <p>&rarr; {{line.direction.fr}}</p>
        <p class="search-result-info-title">{{stop.alpha_nl}}</p>
      </div>
    </article>
  </section>
  <section>
    <header>
      <h4>Address</h4>
    </header>
    <article>
      <div>{{stop.address.nl}}</div>
      <a routerLink="/stops/{{stop.id}}/location">show on map</a>
    </article>
  </section>
  <!-- <label>Proposed change:
    <input [(ngModel)]="stop.name" placeholder="name"/>
  </label> -->
  <div class="buttons">
    <a class="history-button" routerLink="/stops/{{stop.id}}/history">History</a>
    <a class="update-button" (click)="goToQuestions()">Update</a>
  </div>
</div>
