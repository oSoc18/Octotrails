<form class="search-component">
  <mat-form-field class="search-form-field">
    <input matInput placeholder="Search a stop" aria-label="Search..." [matAutocomplete]="auto" [formControl]="stopCtrl">
      <mat-autocomplete #auto="matAutocomplete">
        <mat-option class="mat-option" *ngFor="let stop of filteredStops | async" [value]="stop.name">
          <a class="search-result" routerLink="/stops/{{stop.id}}">
            <section class="search-result-info">
              <h1 class="search-result-info-title">{{stop.name}}</h1>
              <div class="search-result-info-more">
                <ul class="search-result-info-lines">
                  <li class="search-result-info-line" *ngFor="let line of stop.lines[0]" [ngStyle]="{'background-color':line.color}">{{line.number}}</li>
                </ul>
                <div class="search-result-info-direction">
                  <span>&rarr;</span>
                  <span> {{stop.direction}}</span>
                </div>
              </div>
            </section>
          </a>
        </mat-option>
      </mat-autocomplete>
  </mat-form-field>
</form>
<section>
  <agm-map class="map" [latitude]="latitude" [longitude]="longitude">

  </agm-map>
</section>
