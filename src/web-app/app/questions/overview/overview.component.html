<div class="heading">
    <a routerLink="/stops/8022">Go Back</a>
    <h1 class="section-title">Accessibility</h1>
    <h2 class="section-sub-title">Physical</h2>
</div>

<div>
    <mat-progress-bar class="progress-bar" mode="determinate" value="{{progressValue}}">
        
    </mat-progress-bar>
    <p class="progress-tag">{{progressValue}} of 100</p>
</div>

<div *ngFor="let question of questions">
    <ng-container *ngIf="question.type == 'number'">
        <app-question-type-number [question]="question" (answer)= "getAnswer($event)"></app-question-type-number>
    </ng-container>
    <ng-container *ngIf="question.type == 'boolean'">
        <app-question-type-boolean [title]="question.content"></app-question-type-boolean>
    </ng-container>
    <ng-container *ngIf="question.type == 'multiple'">
        <app-question-type-multiple [title]="question.content" [choices]="question.choices"></app-question-type-multiple>
    </ng-container>
    <ng-container *ngIf="question.type == 'string'">
        <app-question-type-string [title]="question.content"></app-question-type-string>
    </ng-container>
</div>

<div class="end-buttons">
    <button class="done-button">Done</button>
    <a class="cancel" routerLink="/stops/8022">Cancel</a>
</div>
