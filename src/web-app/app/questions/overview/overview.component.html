<div>
  <h1>Accessibility</h1>
  <h2>Physical</h2>
  <div>

  <div *ngFor="let question of questions">
      <ng-container *ngIf="question.type == 'number'">
          <app-question-type-number [title]="question.content"></app-question-type-number>
      </ng-container>
      <ng-container *ngIf="question.type == 'boolean'">
          <app-question-type-boolean [title]="question.content"></app-question-type-boolean>
      </ng-container>
      <ng-container *ngIf="question.type == 'multiple'">
          <app-question-type-multiple [title]="question.content" [choices]="question.choices"></app-question-type-multiple>
      </ng-container>
      <ng-container *ngIf="question.type == 'String'">
          <app-question-type-string [title]="question.content"></app-question-type-string>
      </ng-container>
  </div>
</div>
</div>
